name: Incorporar artigo sobre buracos negros aprovado (temporário)
on:
  push:
    branches: [revista-preview-20260917]
    paths: [.github/workflows/revista-buraco-negro-aprovado-temporario.yml]
permissions:
  contents: write
jobs:
  incorporar-artigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Atualizar a fonte editorial com o texto aprovado
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          draft=Path('editorial-revista/REVISAO-TEXTO-BURACO-NEGRO.md')
          text=draft.read_text(encoding='utf-8')
          old_status='**Status:** proposta de texto para aprovação. Não substitui a página da prévia, não altera `main` e não autoriza publicação.'
          assert old_status in text
          part=text.split('## Texto proposto\n',1)[1].split('\n**Imagem da matéria:**',1)[0]
          chunks=re.split(r'\n\s*\n',part.strip())
          clean=lambda s:re.sub(r'\*\*(.*?)\*\*',r'\1',s.strip())
          title=None;subtitle=None;blocks=[]
          for chunk in chunks:
            chunk=' '.join(line.strip() for line in chunk.splitlines())
            if chunk.startswith('### '):
              if title is None:title=clean(chunk[4:])
              else:blocks.append({'tipo':'h2','texto':clean(chunk[4:])})
            elif chunk.startswith('**Linha fina:** '):
              subtitle=clean(chunk.split(':** ',1)[1])
            elif chunk.startswith('> '):
              blocks.append({'tipo':'callout','titulo':'O ponto essencial','texto':clean(chunk[2:].split(':** ',1)[1])})
            else:
              blocks.append({'tipo':'p','texto':clean(chunk)})
          assert title=='Se a luz não tem massa, por que não escapa de um buraco negro?',title
          assert subtitle and len(blocks)==10,(subtitle,len(blocks))
          assert len([b for b in blocks if b['tipo']=='callout'])==1
          p=Path('editorial-revista/conteudo/artigos.json')
          articles=json.loads(p.read_text(encoding='utf-8'))
          assert len(articles)==3
          selected=[a for a in articles if a['slug']=='por-que-luz-nao-escapa-buraco-negro']
          assert len(selected)==1
          a=selected[0]
          assert a['imagem']=='buraco-negro.svg' and not a['destaque']
          a.update(titulo=title,subtitulo=subtitle,corpo=blocks)
          p.write_text(json.dumps(articles,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          draft.write_text(text.replace(old_status,'**Status:** texto aprovado pela responsável editorial e incorporado à prévia. Não publicado em `main`; lançamento ainda não autorizado.'),encoding='utf-8')
          PY
      - name: Gerar e validar sem afetar o site institucional
        shell: bash
        run: |
          python3 editorial-revista/build.py
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('public/revista')
          articles=json.loads(Path('editorial-revista/conteudo/artigos.json').read_text(encoding='utf-8'))
          news=json.loads(Path('editorial-revista/conteudo/noticias.json').read_text(encoding='utf-8'))
          assert len(articles)==3 and len(news)==1
          target=root/'artigos/por-que-luz-nao-escapa-buraco-negro.html'
          html=target.read_text(encoding='utf-8')
          for phrase in ('O horizonte de eventos não funciona como uma parede','O ponto essencial','A luz fica mais lenta lá dentro?','fronteira causal','Ilustração editorial conceitual','noindex,nofollow','PRÉVIA EDITORIAL'):
            assert phrase in html,phrase
          assert 'É comum imaginar que só corpos com massa' not in html
          assert 'Webb encontra anãs marrons com massa estimada' in (root/'index.html').read_text(encoding='utf-8')
          assert not (root/'artigos/quando-previsao-e-classificacao.html').exists()
          for page in [root/'index.html',*root.glob('artigos/*.html'),*root.glob('editorias/*.html')]:
            text=page.read_text(encoding='utf-8')
            assert 'noindex,nofollow' in text and 'PRÉVIA EDITORIAL' in text,page
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          permitted={'editorial-revista/REVISAO-TEXTO-BURACO-NEGRO.md','editorial-revista/conteudo/artigos.json'}
          assert changed<=permitted|{p for p in changed if p.startswith('public/revista/')},changed
          assert permitted<=changed,changed
          assert str(target) in changed,changed
          print('OK: artigo aprovado, 4 artigos, aviso/noindex e alterações restritas à revista.')
          PY
      - name: Registrar somente arquivos da prévia
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial-revista/REVISAO-TEXTO-BURACO-NEGRO.md editorial-revista/conteudo/artigos.json public/revista/
          git diff --cached --check
          git commit -m 'Revista: incorpora artigo de buracos negros aprovado à prévia'
          git push origin HEAD:revista-preview-20260917
