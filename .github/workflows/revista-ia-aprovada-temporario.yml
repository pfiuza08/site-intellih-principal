name: Incorporar artigo IA aprovado na prévia (temporário)
on:
  push:
    branches: [revista-preview-20260917]
    paths: [.github/workflows/revista-ia-aprovada-temporario.yml]
permissions:
  contents: write
jobs:
  incorporar-ia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Aplicar exatamente a proposta editorial aprovada à fonte de dados
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          draft=Path('editorial-revista/REVISAO-TEXTO-IA-NAO-GENERATIVA.md')
          text=draft.read_text(encoding='utf-8')
          old='**Status:** proposta de texto para avaliação da responsável editorial. Não substitui o artigo atual na prévia, não modifica `main` e não autoriza publicação.'
          assert old in text
          part=text.split('## Texto proposto\n',1)[1].split('\n**Imagem da matéria:**',1)[0]
          chunks=re.split(r'\n\s*\n',part.strip())
          clean=lambda value:re.sub(r'\*\*(.*?)\*\*',r'\1',value.strip())
          title=None;subtitle=None;blocks=[]
          for paragraph in chunks:
            paragraph=' '.join(line.strip() for line in paragraph.splitlines())
            if paragraph.startswith('### '):
              if title is None:title=clean(paragraph[4:])
              else:blocks.append({'tipo':'h2','texto':clean(paragraph[4:])})
            elif paragraph.startswith('**Linha fina:** '):
              subtitle=clean(paragraph.split(':** ',1)[1])
            elif paragraph.startswith('> **Antes do prompt, vem o fluxo de trabalho:** '):
              blocks.append({'tipo':'callout','titulo':'Antes do prompt, vem o fluxo de trabalho','texto':clean(paragraph.split(':** ',1)[1])})
            else:
              blocks.append({'tipo':'p','texto':clean(paragraph)})
          assert title=='Nem toda inteligência artificial é generativa: o que cada tipo de aplicação faz?',title
          assert subtitle and len(blocks)==14 and sum(x['tipo']=='h2' for x in blocks)==4 and sum(x['tipo']=='callout' for x in blocks)==1,(subtitle,blocks)
          p=Path('editorial-revista/conteudo/artigos.json')
          articles=json.loads(p.read_text(encoding='utf-8'))
          assert len(articles)==3
          selected=[a for a in articles if a['slug']=='nem-toda-ia-e-generativa']
          assert len(selected)==1
          a=selected[0]
          assert a['imagem']=='ia-modelos.svg' and not a['destaque']
          a.update(titulo=title,subtitulo=subtitle,corpo=blocks,descricao_seo='Nem toda IA é generativa: classificação, previsão, reconhecimento, recomendação e otimização exigem tarefas e critérios de avaliação diferentes.')
          p.write_text(json.dumps(articles,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          draft.write_text(text.replace(old,'**Status:** texto aprovado pela responsável editorial e incorporado à prévia. Não publicado em `main`; lançamento ainda não autorizado.'),encoding='utf-8')
          PY
      - name: Gerar páginas e testar proteção da prévia
        shell: bash
        run: |
          python3 editorial-revista/build.py
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('public/revista')
          articles=json.loads(Path('editorial-revista/conteudo/artigos.json').read_text(encoding='utf-8'))
          news=json.loads(Path('editorial-revista/conteudo/noticias.json').read_text(encoding='utf-8'))
          assert len(articles)==3 and len(news)==1
          page=root/'artigos/nem-toda-ia-e-generativa.html'
          html=page.read_text(encoding='utf-8')
          for phrase in ('Nem toda inteligência artificial é generativa: o que cada tipo de aplicação faz?','Classificar e reconhecer não são o mesmo que gerar','Prever pode significar uma classe ou um número','Recomendar e otimizar são outras tarefas','Antes do prompt, vem o fluxo de trabalho','Nem toda recomendação ou otimização precisa de IA','Ilustração editorial conceitual','noindex,nofollow','PRÉVIA EDITORIAL'):
            assert phrase in html,phrase
          assert 'A popularização dos chatbots fez muita gente' not in html
          assert 'A Lua pode ter se formado em poucas horas? O que uma simulação de 2022 revelou' in (root/'artigos/lua-formacao-em-horas.html').read_text(encoding='utf-8')
          assert 'Webb encontra anãs marrons com massa estimada' in (root/'index.html').read_text(encoding='utf-8')
          assert not (root/'artigos/quando-previsao-e-classificacao.html').exists()
          for item in [root/'index.html',*root.glob('artigos/*.html'),*root.glob('editorias/*.html')]:
            contents=item.read_text(encoding='utf-8')
            assert 'noindex,nofollow' in contents and 'PRÉVIA EDITORIAL' in contents,item
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          allowed={'editorial-revista/REVISAO-TEXTO-IA-NAO-GENERATIVA.md','editorial-revista/conteudo/artigos.json'}
          assert changed<=allowed|{p for p in changed if p.startswith('public/revista/')},changed
          assert allowed<=changed and str(page) in changed,changed
          print('OK: artigo de IA aprovado, 4 textos, noindex e alterações só na prévia.')
          PY
      - name: Commit apenas dos arquivos da revista na branch de revisão
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial-revista/REVISAO-TEXTO-IA-NAO-GENERATIVA.md editorial-revista/conteudo/artigos.json public/revista/
          git diff --cached --check
          git commit -m 'Revista: incorpora texto de IA aprovado à prévia'
          git push origin HEAD:revista-preview-20260917
