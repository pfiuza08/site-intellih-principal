name: Preparar edicao publica da Revista Intellih (temporario)
on:
  push:
    branches: [revista-lancamento-20260918]
    paths: ['.github/workflows/revista-publicar-temporario.yml']
permissions:
  contents: write
jobs:
  preparar:
    if: github.ref == 'refs/heads/revista-lancamento-20260918'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar branch, codigo institucional e blog antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = revista-lancamento-20260918
          git fetch origin main
          for p in public/index.html sitemap.xml robots.txt vercel.json; do
            test "$(git hash-object "$p")" = "$(git rev-parse "origin/main:$p")" || { echo "Arquivo mudou em main: $p"; exit 1; }
          done
          test "$(git rev-parse origin/main:public/blog)" = "$(git rev-parse HEAD:public/blog)"
          echo 'Homepage, sitemap, robots, vercel e blog correspondem a main.'
      - name: Preparar publicacao na data efetiva e auditar
        env:
          REVISTA_DATA_PUBLICACAO: '2026-09-18'
        run: |
          set -euo pipefail
          python3 editorial-revista/preparar_publicacao.py
          python3 -m py_compile editorial-revista/build.py editorial-revista/preparar_publicacao.py
          git diff --check
          git diff --name-only | sort
          test -z "$(git diff --name-only -- public/blog robots.txt vercel.json)"
      - name: Gravar somente os arquivos autorizados na branch de lancamento
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = revista-lancamento-20260918
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial-revista/build.py editorial-revista/conteudo/artigos.json editorial-revista/conteudo/noticias.json public/index.html sitemap.xml public/revista/index.html public/revista/artigos public/revista/editorias
          git diff --cached --quiet && { echo 'Sem alteracoes para publicar'; exit 1; }
          git commit -m 'Preparar primeira edicao publica da Revista Intellih'
          git push origin HEAD:revista-lancamento-20260918
