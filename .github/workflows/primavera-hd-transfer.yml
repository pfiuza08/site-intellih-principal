name: Teste imagem HD Primavera
on:
  push:
    branches: [artigo-primavera-museus-20260922]
    paths: [.github/workflows/primavera-hd-transfer.yml]
permissions:
  contents: read
jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir exportação da imagem original
        shell: bash
        run: |
          set -euo pipefail
          url='https://media.canva.com/v2/document-image/hash:-1612655631/height:335/id:DAHV8D7-4-I/type:B/width:595?brand=BAExP9jtxVI&csig=AAAAAAAAAAAAAAAAAAAAAPZ-GmO3gS0YbapNlBjnohCj-a2tz8OoQRNucQkv1NEm&disableexport=T&exp=1790095741&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2F7-4-I%2FDAHV8D7-4-I%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20260922%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260922T101813Z%26X-Amz-Expires%3D26148%26X-Amz-Signature%3D4385c65a818152c01f59f88b7b643dc7b910d2e29f33818fe7c5d3427d776b92%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DTue%252C%252022%2520Sep%25202026%252017%253A34%253A01%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAAVFWnGLlSM5RBAfc3f46WhVyU4I81o8li146bPKWk_o&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1'
          hd="${url/height:335/height:941}"
          hd="${hd/width:595/width:1672}"
          for variant in original hd; do
            if [ "$variant" = original ]; then u="$url"; else u="$hd"; fi
            code=$(curl -L -sS --max-time 25 -w '%{http_code}' -o "/tmp/$variant" "$u" || true)
            echo "$variant status=$code bytes=$(wc -c < "/tmp/$variant")"
            file "/tmp/$variant"
          done