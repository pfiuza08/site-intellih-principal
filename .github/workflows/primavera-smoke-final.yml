name: Conferir publicacao Cultura no dominio
on:
  push:
    branches: [publicar-primavera-museus-20260922]
    paths: [.github/workflows/primavera-smoke-final.yml]
permissions:
  contents: write
jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar publicacao no dominio publico
        shell: bash
        run: |
          set -euo pipefail
          base=https://www.intellih.com.br
          code=$(curl -L -sS --max-time 30 -w '%{http_code}' -o /tmp/artigo.html "$base/revista/artigos/primavera-dos-museus-bastidores-acervos")
          echo "Artigo HTTP=$code bytes=$(wc -c < /tmp/artigo.html)"
          test "$code" = 200
          grep -q 'Publicado em 22/09/2026' /tmp/artigo.html
          grep -q 'name="robots" content="index,follow"' /tmp/artigo.html
          grep -q 'Ilustração gerada com IA' /tmp/artigo.html
          ! grep -q 'PRÉVIA EDITORIAL' /tmp/artigo.html
          for path in / /blog/ /revista /revista/editorias/cultura /sitemap.xml; do
            code=$(curl -L -sS --max-time 30 -w '%{http_code}' -o /tmp/pg "$base$path")
            echo "$path HTTP=$code bytes=$(wc -c < /tmp/pg)"
            test "$code" = 200
            if [ "$path" = /revista ]; then grep -q 'primavera-dos-museus-bastidores-acervos' /tmp/pg; grep -q 'como-exame-sangue-procura-mais-de-50-canceres' /tmp/pg; fi
            if [ "$path" = /revista/editorias/cultura ]; then grep -q 'primavera-dos-museus-bastidores-acervos' /tmp/pg; grep -q 'name="robots" content="index,follow"' /tmp/pg; fi
            if [ "$path" = /sitemap.xml ]; then grep -q 'revista/editorias/cultura' /tmp/pg; grep -q 'revista/artigos/primavera-dos-museus-bastidores-acervos' /tmp/pg; fi
          done
          code=$(curl -L -sS --max-time 30 -w '%{http_code}' -o /tmp/hd.webp "$base/revista/assets/img/primavera-dos-museus-acervos.webp")
          echo "Imagem HTTP=$code bytes=$(wc -c < /tmp/hd.webp)"
          test "$code" = 200
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/hd.webp').read_bytes()
          assert b[:4]==b'RIFF' and b[8:16]==b'WEBPVP8 '
          w=int.from_bytes(b[26:28],'little')&0x3fff
          h=int.from_bytes(b[28:30],'little')&0x3fff
          assert (w,h)==(1672,941), (w,h)
          print('Imagem HD validada:',w,h,'bytes:',len(b))
          PY
          echo 'PASSOU: homepage, blog, revista, Cultura, artigo indexavel, imagem HD e sitemap.'
      - name: Remover teste temporario
        if: always()
        shell: bash
        run: |
          git config user.name 'Revista Intellih - automacao'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/primavera-smoke-final.yml
          git commit -m 'Remove teste de publicacao temporario'
          git push origin HEAD:publicar-primavera-museus-20260922