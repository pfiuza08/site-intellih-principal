name: Revista — corrigir imagem HD apenas na prévia
on:
  push:
    branches: [artigo-primavera-museus-20260922]
    paths: [.github/workflows/primavera-hd-copiar-para-previa.yml]
permissions:
  contents: write
jobs:
  corrigir-imagem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copiar imagem original verificada e remover aviso de baixa resolução
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          img='public/revista/assets/img/primavera-dos-museus-acervos.webp'
          git show "origin/main:$img" > /tmp/primavera-hd.webp
          test "$(git hash-object /tmp/primavera-hd.webp)" = 'ce4547e4397f8ddc5ab3fc826b24c30e2cf6fe88'
          test "$(wc -c < /tmp/primavera-hd.webp)" -gt 100000
          file /tmp/primavera-hd.webp
          cp /tmp/primavera-hd.webp "$img"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('public/revista/artigos/primavera-dos-museus-bastidores-acervos.html')
          t=p.read_text(encoding='utf-8')
          old='PRÉVIA EDITORIAL — ainda não publicada. Imagem provisória em baixa resolução.'
          assert t.count(old)==1, 'Aviso da prévia inesperado; interromper para não alterar conteúdo incorreto'
          assert 'name="robots" content="noindex,follow"' in t
          p.write_text(t.replace(old,'PRÉVIA EDITORIAL — ainda não publicada.'),encoding='utf-8')
          PY
          git config user.name 'Revista Intellih — automação'
          git config user.email 'actions@users.noreply.github.com'
          git add "$img" public/revista/artigos/primavera-dos-museus-bastidores-acervos.html
          git rm .github/workflows/primavera-hd-copiar-para-previa.yml
          git commit -m 'Substitui miniatura por imagem HD e mantém artigo em prévia'
          git push origin HEAD:artigo-primavera-museus-20260922