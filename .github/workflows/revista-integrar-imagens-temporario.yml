name: Integrar imagens da Revista Intellih (temporario)
on:
  push:
    branches: [revista-preview-20260917]
    paths: [.github/workflows/revista-integrar-imagens-temporario.yml]
permissions:
  contents: write
jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revista-preview-20260917
      - name: Atualizar somente imagens e metadados editoriais
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'revista-preview-20260917'
          python3 - <<'PY'
          import json, hashlib, struct
          from pathlib import Path
          source=Path('editorial-revista/conteudo/artigos.json')
          articles=json.loads(source.read_text(encoding='utf-8'))
          assert len(articles)==3
          replacements={
            'lua-formacao-em-horas': {
              'old':'lua-impacto.svg', 'imagem':'formacao-lua-impacto-realista.png',
              'alt_imagem':'Ilustração artística gerada com IA de uma colisão na Terra primitiva, com material incandescente lançado ao espaço.',
              'credito_imagem':'Ilustração artística gerada com IA para a Revista Intellih, baseada na hipótese de grande impacto para a formação da Lua. Não é fotografia nem imagem da simulação de 2022.'
            },
            'por-que-luz-nao-escapa-buraco-negro': {
              'old':'buraco-negro.svg', 'imagem':'buraco-negro-realista.png',
              'alt_imagem':'Ilustração conceitual gerada com IA de um buraco negro cercado por um disco luminoso de material aquecido.',
              'credito_imagem':'Ilustração conceitual gerada com IA para a Revista Intellih. O brilho representa material aquecido ao redor do buraco negro, não luz emitida de seu interior.'
            },
            'nem-toda-ia-e-generativa': {
              'old':'ia-modelos.svg', 'imagem':'inteligencia-artificial-aplicacoes-pt.png',
              'alt_imagem':'Imagem conceitual gerada com IA de um ambiente de trabalho com computador, representando diferentes aplicações de inteligência artificial.',
              'credito_imagem':'Imagem conceitual gerada com IA para a Revista Intellih, representando aplicações de inteligência artificial em contextos profissionais. A cena não demonstra o funcionamento de um sistema específico.'
            }
          }
          expected_sha={
            'buraco-negro-realista.png':'4bffcb67ee1da069813ec981f2ed6647004284c3',
            'formacao-lua-impacto-realista.png':'ed5dbcf8869721289cbd2df816aff1608787782f',
            'inteligencia-artificial-aplicacoes-pt.png':'dfc4713890a51887792f0491e2a4cf5833f253d1'
          }
          assert set(a['slug'] for a in articles)==set(replacements)
          for a in articles:
            r=replacements[a['slug']]
            assert a['imagem']==r['old'], (a['slug'],a['imagem'])
            path=Path('public/revista/assets/img')/r['imagem']
            data=path.read_bytes()
            assert data[:8]==bytes.fromhex('89504e470d0a1a0a') and len(data)>100000, path
            assert struct.unpack('>II',data[16:24])==(1122,1402), path
            sha=hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()
            assert sha==expected_sha[r['imagem']], (path,sha)
            for key in ('imagem','alt_imagem','credito_imagem'):
              a[key]=r[key]
            assert 'gerada com IA' in a['alt_imagem'] and 'gerada com IA' in a['credito_imagem']
          source.write_text(json.dumps(articles,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          generator=Path('editorial-revista/build.py')
          original=generator.read_text(encoding='utf-8')
          old="elif a['imagem'] not in ('lua-impacto.svg','buraco-negro.svg','ia-modelos.svg'):raise ValueError('Imagem ausente')"
          new="elif a['imagem'] not in ('formacao-lua-impacto-realista.png','buraco-negro-realista.png','inteligencia-artificial-aplicacoes-pt.png') or not (SITE/'assets'/'img'/a['imagem']).is_file():raise ValueError('Imagem ausente ou não aprovada')"
          assert original.count(old)==1,'Validação mudou; abortar'
          generator.write_text(original.replace(old,new),encoding='utf-8')
          print('OK: 3 arquivos PNG conferidos por assinatura, tamanho, dimensões e SHA; textos preservados.')
          PY
          python3 editorial-revista/build.py
      - name: Validar HTMLs, créditos e escopo das mudanças
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          images=Path('public/revista/assets/img')
          pages=Path('public/revista')
          articles=json.loads(Path('editorial-revista/conteudo/artigos.json').read_text(encoding='utf-8'))
          news=json.loads(Path('editorial-revista/conteudo/noticias.json').read_text(encoding='utf-8'))
          assert len(articles)==3 and len(news)==1
          assert news[0]['imagem_url']=='https://cdn.esawebb.org/archives/images/screen/weic2619a.jpg'
          for article in articles:
            image=article['imagem']
            assert (images/image).is_file()
            detail=pages/'artigos'/f"{article['slug']}.html"
            html=detail.read_text(encoding='utf-8')
            assert f'/revista/assets/img/{image}' in html,detail
            assert article['alt_imagem'] in html and article['credito_imagem'] in html,detail
            assert 'noindex,nofollow' in html and 'PRÉVIA EDITORIAL' in html,detail
            assert '<p class="credit">' in html,detail
          all_pages=[pages/'index.html', *sorted((pages/'artigos').glob('*.html')),*sorted((pages/'editorias').glob('*.html'))]
          assert len(all_pages)==12,len(all_pages)
          for page in all_pages:
            text=page.read_text(encoding='utf-8')
            assert 'noindex,nofollow' in text,page
            assert 'lua-impacto.svg' not in text and 'buraco-negro.svg' not in text and 'ia-modelos.svg' not in text,page
          index=(pages/'index.html').read_text(encoding='utf-8')
          assert all(f'/revista/assets/img/{a["imagem"]}' in index for a in articles)
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed and changed <= {'editorial-revista/conteudo/artigos.json','editorial-revista/build.py'}|{p for p in changed if p.startswith('public/revista/')},changed
          assert 'editorial-revista/conteudo/noticias.json' not in changed
          assert {'editorial-revista/conteudo/artigos.json','editorial-revista/build.py'} <= changed
          print('OK: 12 HTMLs mantêm noindex; capa, artigos e editorias referenciam PNGs; créditos e alt verificados; nenhum arquivo institucional alterado.')
          PY
      - name: Salvar somente na branch de previa
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'revista-preview-20260917'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial-revista/conteudo/artigos.json editorial-revista/build.py public/revista/
          git diff --cached --check
          git commit -m 'Revista: integrar imagens realistas geradas com IA somente na prévia'
          git push origin HEAD:revista-preview-20260917