name: Checagem final da Revista Intellih no dominio publico (temporario)
on:
  push:
    branches: [revista-correcao-sitemap-20260918]
    paths: ['.github/workflows/revista-smoke-pos-hotfix-temporario.yml']
permissions:
  contents: read
jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir revista, site, blog, sitemap e metadados publicos
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import urlopen, Request
          from html.parser import HTMLParser
          from xml.etree import ElementTree as ET
          BASE='https://www.intellih.com.br'
          paths=['/', '/blog', '/revista/', '/revista',
            '/revista/artigos/webb-anas-marrons-duas-massas-jupiter',
            '/revista/artigos/lua-formacao-em-horas',
            '/revista/artigos/por-que-luz-nao-escapa-buraco-negro',
            '/revista/artigos/nem-toda-ia-e-generativa',
            '/revista/editorias/ciencia','/revista/editorias/tecnologia',
            '/revista/editorias/parece-inventado','/revista/editorias/inteligencia-artificial',
            '/revista/editorias/natureza','/revista/editorias/cultura',
            '/revista/assets/img/parece-inventado-icone.png',
            '/revista/assets/img/formacao-lua-impacto-realista.webp',
            '/revista/assets/img/buraco-negro-realista.webp',
            '/revista/assets/img/inteligencia-artificial-aplicacoes-pt.webp',
            '/sitemap.xml','/robots.txt']
          class Tags(HTMLParser):
              def __init__(self): super().__init__(); self.meta={}; self.canonical=''
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='meta': self.meta[d.get('name') or d.get('property')]=d.get('content','')
                  if tag=='link' and d.get('rel')=='canonical': self.canonical=d.get('href','')
          errors=[]; results={}
          for path in paths:
              try:
                  with urlopen(Request(BASE+path,headers={'User-Agent':'IntellihMagazineLaunchCheck/1.0'}),timeout=25) as r:
                      status,final,body=r.status,r.url,r.read(2000000)
                  if status!=200 or not final.startswith(BASE+'/'): raise ValueError(f'HTTP={status} final={final}')
                  if not body: raise ValueError('Resposta vazia')
                  results[path]=(final,body)
                  print(f'OK {path}: HTTP={status} final={final} bytes={len(body)}')
              except Exception as e: errors.append(f'{path}: {e}')
          if not errors:
              home=results['/'][1].decode('utf-8')
              if 'href="/revista/">Revista</a>' not in home: errors.append('Sem link Revista na home institucional')
              if results['/revista/'][0]!=BASE+'/revista': errors.append('Redirecionamento inesperado da capa')
              for path in paths:
                  if not path.startswith('/revista') or path.endswith(('.png','.webp')): continue
                  final,raw=results[path]; text=raw.decode('utf-8'); tags=Tags();tags.feed(text)
                  empty=path in ('/revista/editorias/natureza','/revista/editorias/cultura')
                  robots='noindex,follow' if empty else 'index,follow'
                  if tags.meta.get('robots')!=robots: errors.append(f'{path}: robots={tags.meta.get("robots")} != {robots}')
                  if tags.canonical!=final: errors.append(f'{path}: canonical={tags.canonical} != {final}')
                  if tags.meta.get('og:url')!=final: errors.append(f'{path}: og:url={tags.meta.get("og:url")} != {final}')
                  if any(m in text for m in ('PRÉVIA EDITORIAL','Rascunho em','texto em revisão')): errors.append(f'{path}: aviso de previa')
                  if path.startswith('/revista/artigos/') and 'Publicado em 18/09/2026' not in text: errors.append(f'{path}: data de publicacao')
                  if path.endswith('webb-anas-marrons-duas-massas-jupiter') and 'ESA/Webb, NASA, CSA' not in text: errors.append('Credito Webb incorreto')
                  if empty and 'EM PREPARAÇÃO' not in text: errors.append(f'{path}: nao mostra Em preparacao')
              sitemap=ET.fromstring(results['/sitemap.xml'][1]); ns='{http://www.sitemaps.org/schemas/sitemap/0.9}'
              locs=[x.text for x in sitemap.iter(ns+'loc')]
              if len(locs)!=len(set(locs)) or len(locs)!=14: errors.append(f'Sitemap: {len(locs)} URLs, esperado 14 unicas')
              if BASE+'/revista' not in locs: errors.append('Capa revista ausente do sitemap')
              for absent in ('/revista/editorias/natureza','/revista/editorias/cultura','vercel.app'):
                  if any(absent in url for url in locs): errors.append('Sitemap contem '+absent)
              if 'Sitemap: https://www.intellih.com.br/sitemap.xml' not in results['/robots.txt'][1].decode('utf-8'):
                  errors.append('robots.txt nao aponta ao sitemap publico')
          for err in errors: print('FALHA:',err)
          if errors:raise SystemExit(1)
          print('APROVADO: homepage institucional, blog, revista, artigos, editorias, imagens, canonicals, indexacao, robots e sitemap no dominio publico.')
          PY
