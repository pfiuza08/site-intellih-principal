name: Checar URLs da revista antes do lancamento (temporario)
on:
  push:
    branches: [revista-preview-20260917]
    paths: ['.github/workflows/revista-checar-urls-temporario.yml']
permissions:
  contents: read
jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - name: Conferir origem, dominio e redirecionamentos de URLs
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://intellih.com.br/' \
            'https://www.intellih.com.br/' \
            'https://www.intellih.com.br/blog/' \
            'https://www.intellih.com.br/blog' \
            'https://site-intellih-principal-git-318f32-patricias-projects-df23d0bc.vercel.app/revista/' \
            'https://site-intellih-principal-git-318f32-patricias-projects-df23d0bc.vercel.app/revista' \
            'https://site-intellih-principal-git-318f32-patricias-projects-df23d0bc.vercel.app/revista/artigos/nem-toda-ia-e-generativa.html' \
            'https://site-intellih-principal-git-318f32-patricias-projects-df23d0bc.vercel.app/revista/artigos/nem-toda-ia-e-generativa'; do
            echo "URL inicial: $url"
            curl -sSL --max-time 20 --retry 1 -o /dev/null -w 'HTTP final: %{http_code}; URL final: %{url_effective}\n' "$url" || echo 'FALHA DE REDE'
          done
