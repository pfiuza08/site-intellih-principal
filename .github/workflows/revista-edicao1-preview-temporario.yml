name: Aplicar primeira edição da Revista Intellih (temporário)
on:
  push:
    branches: [revista-preview-20260917]
    paths: ['.github/workflows/revista-edicao1-preview-temporario.yml']
permissions:
  contents: write
jobs:
  preparar-edicao:
    if: github.ref == 'refs/heads/revista-preview-20260917'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revista-preview-20260917
          persist-credentials: true
      - name: Manter quatro matérias aprovadas e arquivar a pauta da chuva
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          base = Path('editorial-revista')
          path = base / 'conteudo/artigos.json'
          articles = json.loads(path.read_text(encoding='utf-8'))
          postponed = [a for a in articles if a['slug'] == 'quando-previsao-e-classificacao']
          assert len(postponed) == 1, 'Rascunho da chuva não encontrado exatamente uma vez'
          archive = base / 'rascunhos/quando-previsao-e-classificacao.json'
          archive.parent.mkdir(parents=True, exist_ok=True)
          archive.write_text(json.dumps(postponed[0], ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          selection = [a for a in articles if a['slug'] != 'quando-previsao-e-classificacao']
          assert len(selection) == 3
          path.write_text(json.dumps(selection, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          python3 editorial-revista/build.py
          git rm -f public/revista/artigos/quando-previsao-e-classificacao.html
      - name: Validar edição, crédito, privacidade e escopo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          base = Path('public/revista')
          index = (base / 'index.html').read_text(encoding='utf-8')
          pages = list(base.rglob('*.html'))
          articles = list((base / 'artigos').glob('*.html'))
          assert len(articles) == 4, [p.name for p in articles]
          assert '4 artigos' in index and '4 leituras' in index
          assert 'quando-previsao-e-classificacao' not in index
          assert 'image-credit' in index and 'ESA/Webb, NASA, CSA' in index
          assert all('noindex,nofollow' in p.read_text(encoding='utf-8') for p in pages)
          assert all('quando-previsao-e-classificacao' not in p.read_text(encoding='utf-8') for p in pages)
          print(f'OK: {len(articles)} matérias, {len(pages)} páginas, crédito da capa e noindex')
          PY
          git diff --name-only -- public/index.html public/blog vercel.json public/robots.txt public/sitemap.xml | tee /tmp/institucional-diff
          test ! -s /tmp/institucional-diff
      - name: Registrar páginas geradas só na branch de prévia
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial-revista/conteudo/artigos.json editorial-revista/rascunhos public/revista
          git diff --cached --quiet || git commit -m 'Revista: quatro matérias aprovadas na primeira edição (prévia)'
          git push origin HEAD:revista-preview-20260917
