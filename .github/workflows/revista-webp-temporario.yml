name: Otimizar imagens da Revista Intellih (temporario)
on:
  push:
    branches: [revista-preview-20260917]
    paths: ['.github/workflows/revista-webp-temporario.yml']
permissions:
  contents: write
jobs:
  otimizar:
    if: github.ref == 'refs/heads/revista-preview-20260917'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar conversor em ambiente isolado
        run: |
          python3 -m venv /tmp/revista-pillow
          /tmp/revista-pillow/bin/python -m pip install --quiet pillow
      - name: Gerar WebP e verificar os quatro artigos
        run: /tmp/revista-pillow/bin/python editorial-revista/.otimizar-webp-temporario.py
      - name: Salvar apenas na branch de previa
        run: |
          test "$(git branch --show-current)" = revista-preview-20260917
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial-revista/build.py public/revista/assets/style.css public/revista/assets/img/*.webp public/revista/index.html public/revista/artigos/*.html public/revista/editorias/*.html
          git diff --cached --quiet && { echo 'Nenhuma alteracao nova'; exit 1; }
          git commit -m "Otimizar imagens da revista em WebP com fallback PNG na previa"
          git push origin HEAD:revista-preview-20260917
