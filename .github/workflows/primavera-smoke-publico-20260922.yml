name: Conferir revista publicada - Primavera dos Museus
on:
  push:
    branches: [publicar-primavera-museus-20260922]
    paths: [.github/workflows/primavera-smoke-publico-20260922.yml]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir dominio publico, metadados e imagem HD
        shell: bash
        run: |
          set -euo pipefail
          site=https://www.intellih.com.br
          for try in $(seq 1 15); do
            code=$(curl -L -sS --max-time 25 -w '%{http_code}' -o /tmp/artigo.html "$site/revista/artigos/primavera-dos-museus-bastidores-acervos" || true)
            if [ "$code" = 200 ] && grep -q 'Publicado em 22/09/2026' /tmp/artigo.html && grep -q 'name="robots" content="index,follow"' /tmp/artigo.html; then
              echo "Artigo no dominio: HTTP $code (tentativa $try)"; break
            fi
            echo "Aguardando deploy de producao: tentativa $try HTTP $code"
            sleep 12
          done
          test "$code" = 200
          grep -q 'Publicado em 22/09/2026' /tmp/artigo.html
          grep -q 'name="robots" content="index,follow"' /tmp/artigo.html
          grep -q 'Ilustração gerada com IA' /tmp/artigo.html
          ! grep -q 'PRÉVIA EDITORIAL' /tmp/artigo.html
          for path in / /blog/ /revista /revista/editorias/cultura /revista/assets/img/primavera-dos-museus-acervos.webp /sitemap.xml; do
            code=$(curl -L -sS --max-time 25 -w '%{http_code}' -o /tmp/check "$site$path")
            bytes=$(wc -c < /tmp/check)
            echo "$path HTTP=$code bytes=$bytes"
            test "$code" = 200
            if [ "$path" = /revista/assets/img/primavera-dos-museus-acervos.webp ]; then test "$bytes" -gt 90000; fi
            if [ "$path" = /revista/editorias/cultura ]; then
              grep -q 'primavera-dos-museus-bastidores-acervos' /tmp/check
              grep -q 'name="robots" content="index,follow"' /tmp/check
            fi
            if [ "$path" = /revista ]; then
              grep -q 'primavera-dos-museus-bastidores-acervos' /tmp/check
              grep -q 'como-exame-sangue-procura-mais-de-50-canceres' /tmp/check
            fi
            if [ "$path" = /sitemap.xml ]; then
              grep -q 'revista/editorias/cultura' /tmp/check
              grep -q 'revista/artigos/primavera-dos-museus-bastidores-acervos' /tmp/check
            fi
          done
          curl -L -fsS --max-time 25 "$site/revista/assets/img/primavera-dos-museus-acervos.webp" -o /tmp/primavera.webp
          python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/primavera.webp').read_bytes()
          assert b[:4]==b'RIFF' and b[8:12]==b'WEBP'
          # Formato VP8 WebP: largura e altura em little endian, 14 bits.
          assert b[12:16]==b'VP8 ', b[12:16]
          width=int.from_bytes(b[26:28],'little')&0x3fff
          height=int.from_bytes(b[28:30],'little')&0x3fff
          assert (width,height)==(1672,941),(width,height)
          print('Imagem publicada:',width,'x',height,'pixels;',len(b),'bytes')
          PY
          echo 'PASSOU: artigo, Cultura, capa, site, blog, imagem HD e sitemap.'
      - name: Remover workflow temporario da branch de release
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Revista Intellih - automacao'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/primavera-smoke-publico-20260922.yml
          git commit -m 'Remove smoke test temporario da branch de release'
          git push origin HEAD:publicar-primavera-museus-20260922