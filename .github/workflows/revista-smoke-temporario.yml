name: Verificar Revista Intellih no dominio publico (temporario)
on:
  push:
    branches: [revista-lancamento-20260918]
    paths: ['.github/workflows/revista-smoke-temporario.yml']
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test HTTP dos enderecos e metadados reais
        shell: bash
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from html.parser import HTMLParser
          from xml.etree import ElementTree as ET
          import time

          BASE='https://www.intellih.com.br'
          paths=['/', '/blog', '/revista/', '/revista',
                 '/revista/artigos/webb-anas-marrons-duas-massas-jupiter',
                 '/revista/artigos/lua-formacao-em-horas',
                 '/revista/artigos/por-que-luz-nao-escapa-buraco-negro',
                 '/revista/artigos/nem-toda-ia-e-generativa',
                 '/revista/editorias/ciencia', '/revista/editorias/tecnologia',
                 '/revista/editorias/parece-inventado', '/revista/editorias/inteligencia-artificial',
                 '/revista/editorias/natureza', '/revista/editorias/cultura',
                 '/revista/assets/img/parece-inventado-icone.png',
                 '/revista/assets/img/formacao-lua-impacto-realista.webp',
                 '/revista/assets/img/buraco-negro-realista.webp',
                 '/revista/assets/img/inteligencia-artificial-aplicacoes-pt.webp',
                 '/sitemap.xml']
          class Tags(HTMLParser):
              def __init__(self):super().__init__();self.meta={};self.canonical='';self.links=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='meta':self.meta[d.get('name') or d.get('property')]=d.get('content','')
                  if tag=='link' and d.get('rel')=='canonical':self.canonical=d.get('href','')
                  if tag=='a':self.links.append(d.get('href',''))
          errors=[]; output={}
          for path in paths:
              url=BASE+path
              try:
                  req=Request(url,headers={'User-Agent':'IntellihPublicationSmokeTest/1.0'})
                  with urlopen(req,timeout=25) as res:
                      status=res.status;effective=res.url;data=res.read(1500000)
                  if status!=200 or not effective.startswith(BASE+'/'):
                      raise RuntimeError(f'{status} {effective}')
                  output[path]=(effective,data)
                  print(f'OK {path} HTTP={status} final={effective} bytes={len(data)}')
              except Exception as exc:
                  errors.append(f'{path}: {exc}')
          if not errors:
              home=output['/'][1].decode('utf-8',errors='replace')
              if 'href="/revista/">Revista</a>' not in home:errors.append('Link Revista ausente da homepage institucional')
              if not output['/blog'][1]:errors.append('Blog vazio')
              canonical_home=output['/revista/'][0]
              for path in paths:
                  if not (path.startswith('/revista') and not path.endswith(('.png','.webp'))):continue
                  effective,data=output[path]
                  text=data.decode('utf-8',errors='replace');tags=Tags();tags.feed(text)
                  empty=path in ('/revista/editorias/natureza','/revista/editorias/cultura')
                  if tags.meta.get('robots') != ('noindex,follow' if empty else 'index,follow'):
                      errors.append('robots incorreto: '+path+' '+str(tags.meta.get('robots')))
                  if tags.canonical != effective:
                      errors.append('canonical difere de URL final: '+path+' canonical='+tags.canonical+' efetiva='+effective)
                  if tags.meta.get('og:url') != effective:
                      errors.append('og:url difere de URL final: '+path)
                  if any(mark in text for mark in ('PRÉVIA EDITORIAL','Rascunho em','texto em revisão')):
                      errors.append('Aviso de previa remanescente: '+path)
                  if path.startswith('/revista/artigos/') and 'Publicado em 18/09/2026' not in text:
                      errors.append('Data editorial errada: '+path)
                  if path.endswith('webb-anas-marrons-duas-massas-jupiter') and 'ESA/Webb, NASA, CSA' not in text:
                      errors.append('Credito Webb incompleto')
                  if empty and 'EM PREPARAÇÃO' not in text:
                      errors.append('Editorias vazias nao identificadas: '+path)
              sitemap=output['/sitemap.xml'][1];root=ET.fromstring(sitemap)
              ns='{http://www.sitemaps.org/schemas/sitemap/0.9}'
              locs=[e.text for e in root.iter(ns+'loc')]
              if len(locs)!=len(set(locs)) or len(locs)!=14:errors.append('Sitemap nao tem 14 URLs unicas: '+str(len(locs)))
              if canonical_home not in locs:errors.append('Canonical da capa nao esta no sitemap')
              if any(x in ' '.join(locs) for x in ('/editorias/natureza','/editorias/cultura','vercel.app')):
                  errors.append('Sitemap inclui URLs nao publicaveis')
          if errors:
              for e in errors:print('FALHA:',e)
              raise SystemExit(1)
          print('SMOKE TEST PUBLICO APROVADO: homepage e blog, 9 paginas publicas, 2 editorias em preparacao, imagens e sitemap.')
          PY
