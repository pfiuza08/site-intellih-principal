name: Ajustar editoria de inteligência artificial na prévia (temporário)
on:
  push:
    branches: [revista-preview-20260917]
    paths: [.github/workflows/revista-editoria-ia-temporario.yml]
permissions:
  contents: write
jobs:
  renomear-editoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Ajustar apenas apresentação da editoria e preservar textos aprovados
        shell: bash
        run: |
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          build=Path('editorial-revista/build.py')
          text=build.read_text(encoding='utf-8')
          old="'ia-com-metodo': ('IA com Método', 'O básico técnico e a aplicação prática da inteligência artificial, sem atalhos mágicos.', lambda a: a['categoria'] == 'Tecnologia')"
          new="'inteligencia-artificial': ('Inteligência Artificial', 'Conceitos, aplicações e limites da inteligência artificial, explicados com clareza.', lambda a: a['categoria'] == 'Tecnologia')"
          assert text.count(old)==1
          text=text.replace(old,new)
          oldnav="('ciencia','tecnologia','natureza','cultura','ia-com-metodo')"
          newnav="('ciencia','tecnologia','natureza','cultura','inteligencia-artificial')"
          assert text.count(oldnav)==1
          text=text.replace(oldnav,newnav)
          oldfoot="<a href=\"{prefix}editorias/ia-com-metodo.html\">IA com Método</a>"
          newfoot="<a href=\"{prefix}editorias/inteligencia-artificial.html\">Inteligência Artificial</a>"
          assert text.count(oldfoot)==1
          text=text.replace(oldfoot,newfoot)
          assert 'IA com Método' not in text and 'ia-com-metodo' not in text
          build.write_text(text,encoding='utf-8')
          path=Path('editorial-revista/conteudo/artigos.json')
          articles=json.loads(path.read_text(encoding='utf-8'))
          assert len(articles)==3
          article=next(a for a in articles if a['slug']=='nem-toda-ia-e-generativa')
          assert article['formato']=='IA com Método'
          assert article['titulo']=='Nem toda inteligência artificial é generativa: o que cada tipo de aplicação faz?'
          article['formato']='Explicação'
          path.write_text(json.dumps(articles,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Gerar prévia, manter acesso por URL antiga e verificar escopo
        shell: bash
        run: |
          python3 editorial-revista/build.py
          python3 - <<'PY'
          import json, subprocess
          from html.parser import HTMLParser
          from pathlib import Path
          root=Path('public/revista')
          new=root/'editorias/inteligencia-artificial.html'
          old=root/'editorias/ia-com-metodo.html'
          assert new.is_file() and old.is_file()
          old.write_text('''<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta http-equiv="refresh" content="0;url=/revista/editorias/inteligencia-artificial.html"><title>Inteligência Artificial | Revista Intellih</title></head><body><p>Esta editoria está em <a href="/revista/editorias/inteligencia-artificial.html">Inteligência Artificial</a>.</p></body></html>''',encoding='utf-8')
          pages=[root/'index.html',*root.glob('artigos/*.html'),*root.glob('editorias/*.html')]
          assert len(list(root.glob('artigos/*.html')))==4
          assert len(list(root.glob('editorias/*.html')))==7 # seis editorias + encaminhamento da URL antiga
          assert 'Inteligência Artificial' in new.read_text(encoding='utf-8')
          assert 'IA com Método' not in new.read_text(encoding='utf-8')
          for page in pages:
            text=page.read_text(encoding='utf-8')
            assert 'noindex,nofollow' in text,page
            assert 'IA com Método' not in text,page
            if page!=old:assert 'PRÉVIA EDITORIAL' in text,page
          article=(root/'artigos/nem-toda-ia-e-generativa.html').read_text(encoding='utf-8')
          assert 'Tecnologia · Explicação' in article
          assert 'Antes do prompt, vem o fluxo de trabalho' in article
          assert 'por-que-luz-nao-escapa-buraco-negro' in article
          index=(root/'index.html').read_text(encoding='utf-8')
          assert '/revista/editorias/inteligencia-artificial.html' in index
          assert 'ESA/Webb, NASA, CSA, K. Luhman, C. Alves De Oliveira, M. Zamani (ESA/Webb)' in index
          class Links(HTMLParser):
            def __init__(self):super().__init__();self.links=[]
            def handle_starttag(self, tag, attrs):
              if tag=='a':self.links.extend(v for k,v in attrs if k=='href')
          for page in pages:
            if page==old:continue
            links=Links();links.feed(page.read_text(encoding='utf-8'))
            for link in links.links:
              if not link.startswith('/revista/'):continue
              target=link.split('#',1)[0].split('?',1)[0].removeprefix('/revista/')
              target_path=root/(target or 'index.html')
              assert target_path.is_file(),(page,link)
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          permitted={'editorial-revista/build.py','editorial-revista/conteudo/artigos.json'}
          assert permitted<=changed,changed
          assert changed<=permitted|{str(p) for p in pages},changed
          assert str(root/'artigos/nem-toda-ia-e-generativa.html') in changed
          assert str(old) in changed
          print('OK: editoria Inteligência Artificial, 4 textos preservados, links internos, crédito e noindex; sem alterações fora da revista.')
          PY
      - name: Commit apenas da prévia na branch de revisão
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = 'revista-preview-20260917'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial-revista/build.py editorial-revista/conteudo/artigos.json public/revista/index.html public/revista/artigos/ public/revista/editorias/
          git diff --cached --check
          git commit -m 'Revista: renomeia editoria IA e mantém textos aprovados'
          git push origin HEAD:revista-preview-20260917
