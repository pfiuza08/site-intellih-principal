name: Auditoria pre-publicacao da Revista Intellih (temporaria)
on:
  push:
    branches: [revista-preview-20260917]
    paths: ['.github/workflows/revista-auditoria-prepublicacao-temporario.yml']
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar referencias, creditos, datas e metadados da previa
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          import json, re

          root = Path('public')
          site = root / 'revista'
          arts = json.loads(Path('editorial-revista/conteudo/artigos.json').read_text(encoding='utf-8'))
          news = json.loads(Path('editorial-revista/conteudo/noticias.json').read_text(encoding='utf-8'))
          articles = news + arts
          pages = sorted(site.rglob('*.html'))
          assert len(pages) == 12, f'Quantidade inesperada de HTMLs: {len(pages)}'
          assert len(articles) == 4 and len({a['slug'] for a in articles}) == 4
          assert sum(bool(a.get('destaque')) for a in news) == 1
          assert all(a.get('alt_imagem') and a.get('credito_imagem') for a in articles)
          print('ARTIGOS:', [(a['slug'], a['data'], a.get('data_divulgacao', '-')) for a in articles])
          print('FONTES EXTERNAS:', [(a['slug'], [f['url'] for f in a['fontes']]) for a in articles])

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[]; self.images=[]; self.metas=[]; self.titles=0; self.h1=0; self.ids=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag in ('a','link') and d.get('href'): self.links.append(d['href'])
                  if tag in ('img','script') and d.get('src'): self.links.append(d['src'])
                  if tag == 'img': self.images.append(d)
                  if tag == 'meta': self.metas.append(d)
                  if tag == 'title': self.titles += 1
                  if tag == 'h1': self.h1 += 1
                  if d.get('id'): self.ids.append(d['id'])

          issues=[]; internal=0; missing_meta=[]
          for page in pages:
              text=page.read_text(encoding='utf-8'); p=Parser(); p.feed(text)
              relative=page.relative_to(root)
              if '<meta name="robots" content="noindex,nofollow">' not in text: issues.append(f'{relative}: falta noindex,nofollow na previa')
              if p.titles != 1: issues.append(f'{relative}: titulo HTML: {p.titles}')
              if len(p.ids) != len(set(p.ids)): issues.append(f'{relative}: IDs duplicados')
              for im in p.images:
                  if not im.get('alt'): issues.append(f'{relative}: imagem sem alt: {im.get("src")}')
              for item in p.links:
                  u=urlsplit(item)
                  if u.scheme or u.netloc or item.startswith('#'): continue
                  path=unquote(u.path)
                  if not path: continue
                  if path.startswith('/'):
                      target=root/path.lstrip('/')
                  else:
                      target=page.parent/path
                  if target.is_dir(): target=target/'index.html'
                  if not target.exists() and not target.suffix: target=target.with_suffix('.html')
                  if not target.exists(): issues.append(f'{relative}: referencia interna ausente: {item}')
                  internal += 1
              if page.name != 'ia-com-metodo.html':
                  if not any(m.get('name')=='description' and m.get('content') for m in p.metas): issues.append(f'{relative}: meta description ausente')
                  if not any(m.get('property')=='og:title' for m in p.metas): missing_meta.append(str(relative))
              if page.parent.name=='artigos':
                  if p.h1 != 1: issues.append(f'{relative}: H1s: {p.h1}')
                  if 'Redação Intellih · texto em revisão' not in text: issues.append(f'{relative}: falta identificacao de revisao')

          for a in articles:
              html=(site/'artigos'/f'{a["slug"]}.html').read_text(encoding='utf-8')
              if a['credito_imagem'] not in html: issues.append(f'{a["slug"]}: credito nao encontrado no artigo')
              if a['alt_imagem'].replace('&','&amp;') not in html: issues.append(f'{a["slug"]}: alt nao encontrado no artigo')
              if a.get('imagem_url'):
                  if 'IC 348' not in html or 'ESA/Webb, NASA, CSA' not in html: issues.append('Webb: identificacao e credito ausentes')
              else:
                  img=site/'assets'/'img'/a['imagem']
                  if not img.is_file() or img.stat().st_size<10000: issues.append(f'{a["slug"]}: PNG local ausente ou invalido')
                  print('IMAGEM LOCAL:', a['slug'], a['imagem'], img.stat().st_size if img.exists() else 'ausente', 'bytes')
          for slug in ('natureza', 'cultura'):
              text=(site/'editorias'/f'{slug}.html').read_text(encoding='utf-8')
              if 'EM PREPARAÇÃO' not in text: issues.append(f'{slug}: sem aviso de preparacao')
          for text in ((site/'index.html').read_text(encoding='utf-8'),):
              if not all(f'/revista/editorias/{slug}.html' in text for slug in ('natureza','cultura')):
                  issues.append('Capa: links Natureza/Cultura ausentes')
          css=(site/'assets'/'style.css').read_text(encoding='utf-8')
          if '.article-hero { padding: 18px 16px 16px; }' not in css: issues.append('CSS: ajuste mobile aprovado ausente')
          print('PAGINAS HTML:', len(pages))
          print('REFERENCIAS INTERNAS EXISTENTES CHECADAS:', internal)
          print('PAGINAS SEM METADADOS OG:', len(missing_meta), missing_meta)
          print('AVISOS DE LANCAMENTO: artigos exibem data de rascunho; definir datas reais de publicacao, canonical e OG apenas ao publicar')
          print('PROBLEMAS ESTATICOS:', issues)
          if issues: raise SystemExit(1)
          print('RESULTADO: auditoria estatica da previa passou; auditoria de rede, visual desktop e SEO de lancamento permanecem etapas separadas.')
          PY