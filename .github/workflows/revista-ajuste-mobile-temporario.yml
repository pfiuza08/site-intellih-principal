name: Ajustar abertura dos artigos no celular (temporario)
on:
  push:
    branches: [revista-preview-20260917]
    paths: ['.github/workflows/revista-ajuste-mobile-temporario.yml']
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revista-preview-20260917
          persist-credentials: true
      - name: Corrigir apenas o CSS responsivo das materias
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/revista/assets/style.css')
          css = p.read_text(encoding='utf-8')
          old = '''  .article-hero { padding: 30px 0 23px; }
            .article-hero h1 { font-size: 32px; line-height: 1.12; }
            .article-hero .dek { font-size: 16px; }
            .article-media { padding-inline: 16px; }'''
          # O espaco extra acima e apenas da string Python: os recuos do CSS real sao dois espacos.
          old = old.replace('\n            ', '\n  ')
          new = '''  /* A classe article-hero tambem e wrap: nao zerar as margens laterais no celular. */
            .article-hero { padding: 18px 16px 16px; }
            .article-hero .breadcrumbs { font-size: 12px; line-height: 1.4; margin-bottom: 14px; }
            .article-hero h1 { font-size: clamp(27px, 7.9vw, 30px); line-height: 1.12; letter-spacing: -.035em; margin: 9px 0 12px; overflow-wrap: break-word; }
            .article-hero .dek { font-size: 15px; line-height: 1.5; margin-bottom: 16px; }
            .article-hero .article-meta { gap: 7px 12px; font-size: 11px; line-height: 1.4; padding-top: 12px; }
            .article-media { padding-inline: 16px; }'''
          new = new.replace('\n            ', '\n  ')
          assert css.count(old) == 1, 'Trecho responsivo inesperado; nao aplicar patch inseguro.'
          updated = css.replace(old, new, 1)
          assert updated.count('.article-hero { padding: 18px 16px 16px; }') == 1
          assert updated.count('.article-media { padding-inline: 16px; }') == 1
          p.write_text(updated, encoding='utf-8')
          print('OK: ajuste mobile do hero aplicado apenas ao style.css')
          PY
      - name: Verificar escopo do patch e integridade da previa
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          css = Path('public/revista/assets/style.css').read_text(encoding='utf-8')
          assert '@media (max-width: 540px)' in css
          media = css.split('@media (max-width: 540px)',1)[1].split('@media(prefers-reduced-motion',1)[0]
          for token in ('.article-hero { padding: 18px 16px 16px; }', 'font-size: clamp(27px, 7.9vw, 30px)', '.article-hero .article-meta { gap: 7px 12px;', '.article-media { padding-inline: 16px; }'):
              assert token in media, token
          pages = sorted(Path('public/revista/artigos').glob('*.html'))
          assert len(pages) == 4, len(pages)
          for p in pages:
              text = p.read_text(encoding='utf-8')
              assert '<meta name="robots" content="noindex,nofollow">' in text, p
              assert 'class="wrap article-hero"' in text, p
          print('OK: 4 artigos intactos; regra mobile inclui margens horizontais e titulo compacto.')
          PY
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'public/revista/assets/style.css'
          git diff --stat
      - name: Salvar apenas na branch de previa
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/revista/assets/style.css
          if git diff --cached --quiet; then echo 'Nenhum ajuste detectado'; exit 1; fi
          git commit -m 'Corrigir margens e tipografia da abertura dos artigos no celular'
          git push origin HEAD:revista-preview-20260917
          git rev-parse HEAD