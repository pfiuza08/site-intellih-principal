name: Unificar link institucional da revista (temporario)
on:
  push:
    branches: [revista-preview-20260917]
    paths:
      - '.github/workflows/revista-unificar-link-institucional-temporario.yml'
permissions:
  contents: write
jobs:
  ajustar:
    if: github.ref == 'refs/heads/revista-preview-20260917'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar rodape e validar somente a previa
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess
          assert subprocess.check_output(['git','branch','--show-current'],text=True).strip()=='revista-preview-20260917'
          root=Path('public/revista')
          articles=sorted((root/'artigos').glob('*.html'))
          assert len(articles)==4
          def body(page):
              match=re.search(r'<article class="prose" aria-label="Texto do artigo">(.*?)<section class="source-box"',page.read_text(encoding='utf-8'),re.S)
              assert match,page
              return hashlib.sha256(match.group(1).encode()).hexdigest()
          texts_before={p.name:body(p) for p in articles}
          images_before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'assets'/'img').glob('*') if p.suffix in ('.png','.webp')}
          generator=Path('editorial-revista/build.py')
          code=generator.read_text(encoding='utf-8')
          old='<div><b>Intellih</b><a href="https://www.intellih.com.br/">Site institucional ↗</a><a href="https://www.intellih.com.br/analise-presenca-digital">Soluções para negócios ↗</a><a href="mailto:contato@intellih.com.br">'
          new='<div><b>Intellih</b><a href="https://intellih.com.br/">Soluções baseadas em IA ↗</a><a href="mailto:contato@intellih.com.br">'
          assert code.count(old)==1,'Rodapé diferente do revisado'
          code=code.replace(old,new)
          old_rewrite='    page = page.replace(\'href="https://www.intellih.com.br/analise-presenca-digital"\', \'href="/analise-presenca-digital"\')\n'
          assert code.count(old_rewrite)==1,'Regra legada nao encontrada'
          code=code.replace(old_rewrite,'')
          assert 'analise-presenca-digital' not in code
          generator.write_text(code,encoding='utf-8')
          subprocess.check_call(['python3','editorial-revista/build.py'])
          assert {p.name:body(p) for p in articles}==texts_before,'Corpo editorial alterado'
          assert {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in (root/'assets'/'img').glob('*') if p.suffix in ('.png','.webp')}==images_before,'Imagem alterada'
          pages=sorted(root.rglob('*.html'))
          assert len(pages)==12
          updated=[]
          for page in pages:
              content=page.read_text(encoding='utf-8')
              assert '<meta name="robots" content="noindex,nofollow">' in content,page
              if page.name=='ia-com-metodo.html':continue
              footer=re.search(r'<footer class="footer">(.*?)</footer>',content,re.S)
              assert footer,page
              assert footer.group(1).count('<a href="https://intellih.com.br/">Soluções baseadas em IA ↗</a>')==1,page
              assert 'Site institucional ↗' not in footer.group(1) and 'Soluções para negócios ↗' not in footer.group(1),page
              assert 'analise-presenca-digital' not in content,page
              updated.append(page)
          allowed={'editorial-revista/build.py',*[str(p) for p in pages]}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed.issubset(allowed),changed-allowed
          print('SUCESSO:',len(updated),'paginas com um unico link institucional; 4 corpos, imagens, noindex e demais arquivos preservados.')
          PY
      - name: Salvar exclusivamente na branch de previa
        run: |
          test "$(git branch --show-current)" = revista-preview-20260917
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial-revista/build.py public/revista/index.html public/revista/artigos/*.html public/revista/editorias/*.html
          git diff --cached --quiet && { echo 'Nenhuma alteracao'; exit 1; }
          git commit -m "Unificar links do rodape em Solucoes baseadas em IA na previa"
          git push origin HEAD:revista-preview-20260917
