name: Incorporar texto Webb aprovado na prévia (temporário)
on:
  push:
    branches: [revista-preview-20260917]
    paths: [.github/workflows/revista-webb-aprovado-temporario.yml]
permissions:
  contents: write
jobs:
  incorporar-webb:
    if: github.ref == 'refs/heads/revista-preview-20260917'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Integrar texto aprovado à fonte editorial
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          draft=Path('editorial-revista/REVISAO-TEXTO-WEBB.md')
          text=draft.read_text(encoding='utf-8')
          assert '**Status:** proposta de texto para aprovação' in text
          part=text.split('## Texto proposto\n',1)[1].split('\n## Orientações para edição da prévia',1)[0]
          chunks=re.split(r'\n\s*\n',part.strip())
          clean=lambda s:re.sub(r'\*\*(.*?)\*\*',r'\1',s.strip())
          title=None;subtitle=None;blocks=[]
          for chunk in chunks:
            chunk=' '.join(x.strip() for x in chunk.splitlines())
            if chunk.startswith('### '):
              if title is None:title=clean(chunk[4:])
              else:blocks.append({'tipo':'h2','texto':clean(chunk[4:])})
            elif chunk.startswith('**Linha fina:** '):subtitle=clean(chunk.split(':** ',1)[1])
            elif chunk.startswith('> '):
              blocks.append({'tipo':'callout','titulo':'O que se sabe e o que ainda se investiga','texto':clean(chunk[2:])})
            else:blocks.append({'tipo':'p','texto':clean(chunk)})
          assert title=='Webb encontra anãs marrons com massa estimada em apenas duas vezes a de Júpiter',title
          assert subtitle and len(blocks)==12,(subtitle,len(blocks))
          p=Path('editorial-revista/conteudo/noticias.json')
          news=json.loads(p.read_text(encoding='utf-8'))
          assert len(news)==1 and news[0]['slug']=='webb-anas-marrons-duas-massas-jupiter'
          a=news[0]
          a.update(titulo=title,titulo_seo='Webb encontra anãs marrons com massa estimada em duas vezes a de Júpiter',subtitulo=subtitle,descricao_seo='Na região IC 348, o James Webb identificou anãs marrons com massa estimada em cerca de duas vezes a de Júpiter. Entenda o estudo.',chamada='Uma massa comparável à de um planeta gigante, mas uma formação semelhante à de estrelas.',corpo=blocks)
          p.write_text(json.dumps(news,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          draft.write_text(text.replace('**Status:** proposta de texto para aprovação; não substitui a página publicada na prévia, não altera `main` e não autoriza lançamento.','**Status:** texto aprovado pela responsável editorial e incorporado à prévia; não publicado em `main` e sem autorização para lançamento.'),encoding='utf-8')
          PY
      - name: Gerar e conferir apenas páginas autorizadas da revista
        shell: bash
        run: |
          python3 editorial-revista/build.py
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          root=Path('public/revista')
          news=json.loads(Path('editorial-revista/conteudo/noticias.json').read_text(encoding='utf-8'))
          other=json.loads(Path('editorial-revista/conteudo/artigos.json').read_text(encoding='utf-8'))
          assert len(news)==1 and len(other)==3
          target='Webb encontra anãs marrons com massa estimada em apenas duas vezes a de Júpiter'
          pages=[root/'index.html',root/'artigos/webb-anas-marrons-duas-massas-jupiter.html',root/'editorias/ciencia.html',root/'editorias/parece-inventado.html']
          for page in pages:
            html=page.read_text(encoding='utf-8')
            assert target in html and 'noindex,nofollow' in html and 'PRÉVIA EDITORIAL' in html,page
            assert 'ESA/Webb, NASA, CSA, K. Luhman, C. Alves De Oliveira, M. Zamani (ESA/Webb)' in html,page
          article=pages[1].read_text(encoding='utf-8')
          assert 'O que se sabe e o que ainda se investiga' in article
          assert 'Não é uma fotografia individual da anã marrom' in article
          assert not (root/'artigos/quando-previsao-e-classificacao.html').exists()
          allowed={'editorial-revista/REVISAO-TEXTO-WEBB.md','editorial-revista/conteudo/noticias.json','public/revista/index.html','public/revista/artigos/webb-anas-marrons-duas-massas-jupiter.html','public/revista/editorias/ciencia.html','public/revista/editorias/parece-inventado.html'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed<=allowed, f'Arquivos não autorizados modificados: {changed-allowed}'
          assert allowed<=changed, f'Arquivos esperados não modificados: {allowed-changed}'
          print('OK: texto aprovado, 4 artigos, crédito visível, noindex e escopo limitado à prévia.')
          PY
      - name: Commit exclusivo da prévia
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial-revista/REVISAO-TEXTO-WEBB.md editorial-revista/conteudo/noticias.json public/revista/index.html public/revista/artigos/webb-anas-marrons-duas-massas-jupiter.html public/revista/editorias/ciencia.html public/revista/editorias/parece-inventado.html
          git diff --cached --check
          git commit -m 'Revista: incorpora texto Webb aprovado à prévia'
          git push origin HEAD:revista-preview-20260917