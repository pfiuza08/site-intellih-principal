name: Preparar release Natureza - Adenomera varcena
on:
  push:
    branches: [publicar-natureza-adenomera-varcena-20260922]
    paths: ['.github/workflows/natureza-varcena-preparar-release.yml']
permissions:
  contents: write
jobs:
  release:
    if: github.event.head_commit.message == 'Preparar release Natureza a partir da main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trazer conteudo aprovado, preparar paginas publicas e verificar diferencas
        shell: bash
        run: |
          set -euo pipefail
          preview=previa-natureza-adenomera-varcena-20260922
          git fetch --no-tags origin "$preview:refs/remotes/origin/$preview"
          git show "origin/$preview:editorial-revista/conteudo/novas/adenomera-varcena-canto-amazonia.json" > editorial-revista/conteudo/novas/adenomera-varcena-canto-amazonia.json
          git show "origin/$preview:public/revista/assets/img/varzea-rio-urubu-katja-schulz.webp" > public/revista/assets/img/varzea-rio-urubu-katja-schulz.webp
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo
          p=Path('editorial-revista/conteudo/novas/adenomera-varcena-canto-amazonia.json')
          a=json.loads(p.read_text(encoding='utf-8'))
          assert a['slug']=='adenomera-varcena-canto-amazonia' and a['categoria']=='Natureza'
          assert a['imagem']=='varzea-rio-urubu-katja-schulz.webp'
          assert a['fonte_imagem'].startswith('https://commons.wikimedia.org/') and 'CC BY 2.0' in a['credito_imagem']
          assert 'não do Alto Juruá nem da rã' in a['legenda_imagem']
          d=datetime.now(ZoneInfo('America/Sao_Paulo')).date().isoformat()
          assert d >= '2026-09-22', d
          a['data']=a['publicado_em']=d
          p.write_text(json.dumps(a,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Data efetiva de publicacao (BRT):',d)
          PY
          python3 editorial-revista/build.py
          python3 - <<'PY'
          from pathlib import Path
          import json, re, subprocess, xml.etree.ElementTree as ET
          slug='adenomera-varcena-canto-amazonia'
          a=json.loads(Path('editorial-revista/conteudo/novas/'+slug+'.json').read_text(encoding='utf-8'))
          d=a['publicado_em']
          allowed={f'editorial-revista/conteudo/novas/{slug}.json',f'public/revista/artigos/{slug}.html','public/revista/assets/img/varzea-rio-urubu-katja-schulz.webp','public/revista/editorias/natureza.html','public/revista/index.html','sitemap.xml','public/sitemap.xml','.github/workflows/natureza-varcena-preparar-release.yml'}
          changes=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          for path in changes:
              if path not in allowed:
                  subprocess.run(['git','restore','--',path],check=True)
          article=Path('public/revista/artigos/'+slug+'.html').read_text(encoding='utf-8')
          nature=Path('public/revista/editorias/natureza.html').read_text(encoding='utf-8')
          cover=Path('public/revista/index.html').read_text(encoding='utf-8')
          for html in (article,nature,cover):
              assert 'name="robots" content="index,follow"' in html
              assert 'PRÉVIA EDITORIAL' not in html and 'PRÉVIA EDITORIAL —' not in html
              assert slug in html
          assert '<h1>O canto que revelou uma nova rã na Amazônia</h1>' in article
          assert 'Publicado em '+__import__('datetime').datetime.strptime(d,'%Y-%m-%d').strftime('%d/%m/%Y') in article
          assert 'Katja Schulz' in article and 'não do Alto Juruá nem da rã' in article
          assert f'<meta property="article:published_time" content="{d}">' in article
          assert 'como-exame-sangue-procura-mais-de-50-canceres' in cover and 'primavera-dos-museus-bastidores-acervos' in cover
          assert Path('public/revista/assets/img/varzea-rio-urubu-katja-schulz.webp').stat().st_size > 90000
          root=Path('sitemap.xml'); public=Path('public/sitemap.xml')
          s=root.read_text(encoding='utf-8')
          assert s==public.read_text(encoding='utf-8'),'Os sitemaps de base divergem'
          assert slug not in s and 'revista/editorias/natureza</loc>' not in s
          match=r'(<loc>https://www\.intellih\.com\.br/revista</loc>\s*<lastmod>)[^<]+(</lastmod>)'
          assert re.search(match,s)
          s=re.sub(match,lambda m:m.group(1)+d+m.group(2),s,count=1)
          addition=(f'  <!-- Revista Intellih: Natureza - nova ra da Amazonia -->\n'
                    f'  <url>\n    <loc>https://www.intellih.com.br/revista/editorias/natureza</loc>\n    <lastmod>{d}</lastmod>\n  </url>\n'
                    f'  <url>\n    <loc>https://www.intellih.com.br/revista/artigos/{slug}</loc>\n    <lastmod>{d}</lastmod>\n  </url>\n')
          assert s.count('</urlset>')==1
          s=s.replace('</urlset>',addition+'</urlset>')
          ET.fromstring(s)
          root.write_text(s,encoding='utf-8');public.write_text(s,encoding='utf-8')
          assert root.read_bytes()==public.read_bytes()
          print('PASSOU: artigo publico, credito fotografico, natureza, capa, imagem HD e sitemaps identicos')
          PY
          git config user.name 'Revista Intellih - publicacao'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/natureza-varcena-preparar-release.yml
          git add editorial-revista/conteudo/novas/adenomera-varcena-canto-amazonia.json public/revista/artigos/adenomera-varcena-canto-amazonia.html public/revista/assets/img/varzea-rio-urubu-katja-schulz.webp public/revista/editorias/natureza.html public/revista/index.html sitemap.xml public/sitemap.xml
          git diff --cached --name-only
          test "$(git diff --cached --name-only | wc -l)" -eq 8
          git diff --cached --name-only | grep -q '^public/revista/editorias/natureza.html$'
          git diff --cached --name-only | grep -q '^public/revista/assets/img/varzea-rio-urubu-katja-schulz.webp$'
          git commit -m 'Publicar Natureza: canto da Adenomera varcena e abrir editoria'
          git push origin HEAD:publicar-natureza-adenomera-varcena-20260922