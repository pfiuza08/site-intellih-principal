name: Revista — montar prévia Primavera dos Museus
on:
  push:
    branches: [artigo-primavera-museus-20260922]
    paths: [.github/workflows/primavera-preview.yml]
permissions:
  contents: write
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar imagem provisória e páginas da revista
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          mkdir -p public/revista/assets/img
          curl -fsSL --retry 2 --max-time 40 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F0ca98624-44aa-466f-ac44-b52322a87c0c/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAADSA3x444syzm67NLtB4X1UYtNldjs3fcfYl3ShJCrR_&exp=1790106385&osig=AAAAAAAAAAAAAAAAAAAAAHvYzd3W3AS3j-uYd081HNMWrPdlEGMBZzcWtCLXhexc&signer=media-rpc&x-canva-quality=thumbnail' -o /tmp/primavera-preview.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          im=Image.open('/tmp/primavera-preview.png').convert('RGB')
          assert im.size==(160,200),im.size
          im.resize((480,600),Image.Resampling.LANCZOS).save('public/revista/assets/img/primavera-dos-museus-acervos.webp','WEBP',quality=78)
          PY
          python3 editorial-revista/build.py
          python3 - <<'PY'
          from pathlib import Path
          htmls=list(Path('public/revista').rglob('*.html'))
          for p in htmls:
              s=p.read_text(encoding='utf-8')
              s=s.replace('<meta name="robots" content="index,follow">','<meta name="robots" content="noindex,follow">')
              s=s.replace('<body>', '<body><div style="padding:12px;text-align:center;background:#fff0db;color:#492900;font:700 14px Arial,sans-serif">PRÉVIA EDITORIAL — ainda não publicada. Imagem provisória em baixa resolução.</div>',1)
              p.write_text(s,encoding='utf-8')
          article=Path('public/revista/artigos/primavera-dos-museus-bastidores-acervos.html')
          assert article.exists(), 'Matéria não foi gerada'
          assert 'noindex,follow' in article.read_text()
          assert 'Ilustração gerada com IA' in article.read_text()
          cultura=Path('public/revista/editorias/cultura.html').read_text()
          assert 'O que os museus guardam' in cultura and 'Esta editoria está em preparação' not in cultura
          assert len(htmls)>=13,len(htmls)
          print('Prévia verificada:',len(htmls),'páginas; artigo, crédito e editoria Cultura OK')
          PY
      - name: Salvar apenas os arquivos da revista na branch de prévia
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Revista Intellih — automação'
          git config user.email 'actions@users.noreply.github.com'
          git add public/revista
          git rm -rf editorial-revista/.imagem-partes .github/workflows/primavera-media-check.yml .github/workflows/primavera-preview.yml
          git diff --cached --name-only
          git commit -m 'Gera prévia isolada de Cultura e remove recursos temporários'
          git push origin HEAD:artigo-primavera-museus-20260922