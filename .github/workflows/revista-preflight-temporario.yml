name: Auditoria pre-lancamento da revista (temporaria)
on:
  push:
    branches:
      - revista-preview-20260917
    paths:
      - .github/workflows/revista-preflight-temporario.yml
permissions:
  contents: read
jobs:
  preflight:
    if: github.ref == 'refs/heads/revista-preview-20260917'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar branch de previa
        run: test "$(git branch --show-current)" = revista-preview-20260917
      - name: Auditar HTML, fontes locais e protecoes de previa
        run: python3 editorial-revista/preflight.py
      - name: Confirmar que a auditoria nao modifica arquivos
        run: test -z "$(git status --porcelain)"
