name: Gerar previa editorial Galleri
on:
  push:
    branches:
      - revista-galleri-20260921
permissions:
  contents: write
jobs:
  preparar-previa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar gerador para novas materias sem afetar os artigos existentes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('editorial-revista/build.py')
          code = p.read_text(encoding='utf-8')
          before = "NEWS = json.loads((BASE / 'conteudo' / 'noticias.json').read_text(encoding='utf-8'))"
          after = before + "\nNOVAS = [json.loads(p.read_text(encoding='utf-8')) for p in sorted((BASE / 'conteudo' / 'novas').glob('*.json'))]\nif NOVAS:\n    NEWS = sorted(NEWS + NOVAS, key=lambda a: a.get('data', ''), reverse=True)\n    destaque_slug = NEWS[0]['slug']\n    NEWS = [{**a, 'destaque': a['slug'] == destaque_slug} for a in NEWS]"
          assert code.count(before) == 1, 'Ponto de leitura de noticias nao encontrado ou ambiguo'
          code = code.replace(before, after)
          date_before = "PUBLICATION_DATE = '2026-09-18'"
          assert code.count(date_before) == 1, 'Data da capa mudou; revisar antes de continuar'
          code = code.replace(date_before, "PUBLICATION_DATE = max(a.get('publicado_em', a.get('data', '2026-09-18')) for a in ARTICLES)")
          image_before = "elif a['imagem'] not in ('formacao-lua-impacto-realista.png','buraco-negro-realista.png','inteligencia-artificial-aplicacoes-pt.png') or not (SITE/'assets'/'img'/a['imagem']).is_file():raise ValueError('Imagem ausente ou não aprovada')"
          image_after = "elif not a.get('imagem') or Path(a['imagem']).name != a['imagem'] or Path(a['imagem']).suffix.lower() not in ('.png','.jpg','.jpeg','.webp') or not (SITE/'assets'/'img'/a['imagem']).is_file() or not a.get('credito_imagem'):raise ValueError('Imagem ausente, sem credito ou com caminho invalido')"
          assert code.count(image_before) == 1, 'Validacao de imagem mudou; revisar antes de continuar'
          code = code.replace(image_before, image_after)
          p.write_text(code, encoding='utf-8')
          PY
      - name: Otimizar imagem e gerar paginas
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p = Path('public/revista/assets/img/galleri-exame-multicancer.png')
          assert p.is_file(), 'Imagem original Galleri nao encontrada'
          with Image.open(p) as im:
              im.convert('RGB').save(p.with_suffix('.webp'), 'WEBP', quality=82, method=6)
          print('Imagem original e versao WebP confirmadas')
          PY
          python3 editorial-revista/build.py
      - name: Proteger a previa de indexacao e conferir o artigo
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('public/revista')
          pages = list(root.rglob('*.html'))
          for page in pages:
              html = page.read_text(encoding='utf-8')
              for previous in ('<meta name="robots" content="index,follow">', '<meta name="robots" content="noindex,follow">'):
                  html = html.replace(previous, '<meta name="robots" content="noindex,nofollow">')
              assert '<meta name="robots" content="noindex,nofollow">' in html, f'Indexacao ativa em {page}'
              page.write_text(html, encoding='utf-8')
          article = json.loads(Path('editorial-revista/conteudo/novas/galleri-exame-multicancer.json').read_text(encoding='utf-8'))
          slug = article['slug']
          page = root/'artigos'/f'{slug}.html'
          assert page.is_file() and article['titulo'] in page.read_text(encoding='utf-8'), 'Artigo nao foi gerado corretamente'
          homepage = (root/'index.html').read_text(encoding='utf-8')
          assert slug in homepage and '5 artigos' in homepage, 'Nova materia nao aparece na capa'
          assert slug in (root/'editorias/ciencia.html').read_text(encoding='utf-8'), 'Nova materia nao aparece em Ciencia'
          assert (root/'assets/img/galleri-exame-multicancer.webp').is_file(), 'Imagem WebP ausente'
          print(f'Prévia validada: {len(pages)} paginas; cinco artigos; Galleri na capa e em Ciencia; sem indexacao')
          PY
      - name: Salvar previa na branch e remover workflow temporario
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial-revista/build.py public/revista/
          git rm -- .github/workflows/revista-galleri-previa.yml
          git diff --cached --check
          git commit -m 'Gerar previa Galleri: cinco artigos, imagem WebP e noindex [skip ci]'
          git push origin HEAD:revista-galleri-20260921
