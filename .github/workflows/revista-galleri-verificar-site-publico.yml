name: Revista - smoke test publico Galleri
on:
  push:
    branches: [revista-galleri-20260921]
    paths: ['.github/workflows/revista-galleri-verificar-site-publico.yml']
permissions:
  contents: write
jobs:
  conferir-producao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: revista-galleri-20260921
      - name: Conferir URLs e conteudo no dominio publico
        run: |
          python3 - <<'PY'
          import time
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError,URLError
          from xml.etree import ElementTree as ET

          base='https://www.intellih.com.br'
          slug='como-exame-sangue-procura-mais-de-50-canceres'
          paths=['/revista/artigos/'+slug,'/revista','/revista/editorias/ciencia','/revista/assets/img/galleri-exame-multicancer.webp','/revista/assets/img/galleri-exame-multicancer.png','/sitemap.xml','/','/blog','/revista/editorias/natureza','/revista/editorias/cultura']
          checks={}
          for path in paths:
              url=base+path
              for attempt in range(8):
                  try:
                      with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 RevistaIntellihPublicationCheck/1.0'}),timeout=20) as response:
                          code=response.status
                          body=response.read()
                          final=response.url
                      assert code==200 and len(body)>200,(code,len(body))
                      checks[path]=(body,final)
                      print(f'OK {path} HTTP {code}, {len(body)} bytes, destino {final}')
                      break
                  except Exception as e:
                      if attempt==7:raise RuntimeError(f'Falha em {path}: {e}') from e
                      time.sleep(5)
          text=lambda path:checks[path][0].decode('utf-8')
          article=text('/revista/artigos/'+slug)
          index=text('/revista')
          science=text('/revista/editorias/ciencia')
          assert 'Publicado em 21/09/2026' in article
          assert 'Como um exame de sangue procura mais de 50 tipos de câncer?' in article
          assert 'content="index,follow"' in article and 'content="noindex,nofollow"' not in article
          assert 'galleri-exame-multicancer.webp' in article and 'Imagem conceitual gerada com IA' in article
          assert slug in index and '5 artigos' in index and slug in science
          for path in ('/revista/editorias/natureza','/revista/editorias/cultura'):
              assert 'content="noindex,follow"' in text(path)
          sitemap=text('/sitemap.xml')
          ET.fromstring(sitemap)
          assert sitemap.count('<loc>'+base+'/revista/artigos/'+slug+'</loc>')==1
          assert '<lastmod>2026-09-21</lastmod>' in sitemap
          assert checks['/revista/assets/img/galleri-exame-multicancer.webp'][0][:4]==b'RIFF'
          assert checks['/revista/assets/img/galleri-exame-multicancer.png'][0][:8]==b'\x89PNG\r\n\x1a\n'
          print('PASSOU: URLs publicas, artigo, capa, Ciência, imagens, sitemap, site, blog e editorias vazias')
          PY
      - name: Remover workflow temporario da branch de trabalho
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/revista-galleri-verificar-site-publico.yml
          git commit -m 'Limpar verificacao temporaria do deploy Galleri'
          git push origin HEAD:revista-galleri-20260921
