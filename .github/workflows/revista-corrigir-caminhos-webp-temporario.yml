name: Corrigir caminhos de imagens WebP da revista (temporario)
on:
  push:
    branches: [revista-preview-20260917]
    paths: ['.github/workflows/revista-corrigir-caminhos-webp-temporario.yml']
permissions:
  contents: write
jobs:
  corrigir:
    if: github.ref == 'refs/heads/revista-preview-20260917'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir srcset, regenerar e validar as imagens
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess
          from html.parser import HTMLParser
          assert subprocess.check_output(['git','branch','--show-current'],text=True).strip() == 'revista-preview-20260917'
          site=Path('public/revista')
          articles=sorted((site/'artigos').glob('*.html'))
          assert len(articles)==4
          def body(path):
              m=re.search(r'<article class="prose" aria-label="Texto do artigo">(.*?)<section class="source-box"',path.read_text(encoding='utf-8'),re.S)
              assert m, str(path)
              return m.group(1)
          original_bodies={p.name:hashlib.sha256(body(p).encode()).hexdigest() for p in articles}
          original_img={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in (site/'assets'/'img').glob('*') if p.suffix in ('.webp','.png')}
          buildpath=Path('editorial-revista/build.py')
          build=buildpath.read_text(encoding='utf-8')
          old="optimized=asset('img/'+Path(a['imagem']).with_suffix('.webp').name,prefix)"
          new="optimized='/revista/assets/img/'+Path(a['imagem']).with_suffix('.webp').name"
          assert build.count(old)==1, 'Gerador não contém a expressão esperada exatamente uma vez'
          buildpath.write_text(build.replace(old,new),encoding='utf-8')
          subprocess.check_call(['python3','editorial-revista/build.py'])
          assert {p.name:hashlib.sha256(body(p).encode()).hexdigest() for p in articles}==original_bodies, 'Texto aprovado alterado'
          assert {str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in (site/'assets'/'img').glob('*') if p.suffix in ('.webp','.png')}==original_img, 'Imagens originais alteradas'
          class SrcParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.sources=[]; self.images=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='source' and a.get('type')=='image/webp': self.sources.append(a.get('srcset'))
                  if tag=='img': self.images.append(a)
          pages=sorted(site.rglob('*.html'))
          assert len(pages)==12
          checked=0
          for page in pages:
              raw=page.read_text(encoding='utf-8')
              assert '<meta name="robots" content="noindex,nofollow">' in raw
              p=SrcParser();p.feed(raw)
              for srcset in p.sources:
                  assert srcset and srcset.startswith('/revista/assets/img/') and srcset.endswith('.webp'), (page,srcset)
                  assert (Path('public')/srcset.lstrip('/')).is_file(), (page,srcset)
                  checked+=1
              assert all(img.get('alt') for img in p.images)
          assert checked>=12, f'Muito poucas referencias WebP validadas: {checked}'
          for article in articles:
              text=article.read_text(encoding='utf-8')
              assert ('ESA/Webb, NASA, CSA' in text or 'gerada com IA para a Revista Intellih' in text),article
          print('SUCESSO:',len(pages),'HTMLs e',checked,'srcsets WebP absolutos; imagens existentes, textos aprovados, creditos e noindex preservados.')
          PY
      - name: Salvar correção somente na branch de prévia
        run: |
          test "$(git branch --show-current)" = revista-preview-20260917
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial-revista/build.py public/revista/index.html public/revista/artigos/*.html public/revista/editorias/*.html
          git diff --cached --quiet && { echo 'Nenhuma alteração para salvar'; exit 1; }
          git commit -m "Corrigir srcset WebP absoluto em todas as paginas da previa"
          git push origin HEAD:revista-preview-20260917