name: Ajustar simbolo Parece Inventado na previa (temporario)
on:
  push:
    branches: [revista-preview-20260917]
    paths: ['.github/workflows/revista-simbolo-parece-inventado-temporario.yml']
permissions:
  contents: write
jobs:
  ajustar:
    if: github.ref == 'refs/heads/revista-preview-20260917'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Pillow para extrair o simbolo com transparencia
        run: python3 -m pip install --quiet pillow
      - name: Substituir imagem no gerador, ajustar CSS e testar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageChops
          import hashlib, re, subprocess
          assert subprocess.check_output(['git','branch','--show-current'],text=True).strip()=='revista-preview-20260917'
          root=Path('public/revista')
          source=root/'assets/img/parece-inventado-simbolo.png'
          assert source.is_file(), 'Imagem enviada nao encontrada'
          assert subprocess.check_output(['git','hash-object',str(source)],text=True).strip()=='998a71ebeb8dd54b69b2cce3959dd6ef44c5d478', 'Imagem enviada mudou: rever recorte'
          original=Image.open(source).convert('RGBA')
          assert original.size==(1254,1254),original.size
          assert original.getpixel((0,0))[3]==0, 'Imagem original sem transparencia'
          articles=sorted((root/'artigos').glob('*.html'))
          assert len(articles)==4
          def article_body(p):
              m=re.search(r'<article class="prose" aria-label="Texto do artigo">(.*?)<section class="source-box"',p.read_text(encoding='utf-8'),re.S)
              assert m,p
              return hashlib.sha256(m.group(1).encode()).hexdigest()
          before={p.name:article_body(p) for p in articles}
          mask=Image.new('L',original.size,0)
          ImageDraw.Draw(mask).ellipse((254,48,1002,796),fill=255)
          icon=original.copy()
          icon.putalpha(ImageChops.multiply(icon.getchannel('A'),mask))
          icon=icon.crop((239,33,1017,811)).resize((600,600),Image.Resampling.LANCZOS)
          target=root/'assets/img/parece-inventado-icone.png'
          assert not target.exists(), 'Icone ja existe: nao sobrescrever'
          icon.save(target,optimize=True)
          assert Image.open(target).getpixel((0,0))[3]==0 and Image.open(target).getpixel((300,300))[3]>0
          buildfile=Path('editorial-revista/build.py')
          build=buildfile.read_text(encoding='utf-8')
          old='<img class="feature-symbol" src="./assets/img/intellih-symbol-dark.png" width="320" height="320" alt="Símbolo da Intellih">'
          new='<img class="feature-symbol parece-symbol" src="/revista/assets/img/parece-inventado-icone.png" width="600" height="600" alt="Símbolo do especial Parece Inventado?" loading="lazy">'
          assert build.count(old)==1, 'Trecho antigo nao encontrado uma unica vez'
          buildfile.write_text(build.replace(old,new),encoding='utf-8')
          cssfile=root/'assets/style.css'
          css=cssfile.read_text(encoding='utf-8')
          assert '.brand-feature .parece-symbol' not in css, 'Estilo do novo simbolo ja existe'
          css+='\n/* Especial Parece Inventado: apenas o simbolo recortado, sem caixa ou sombra. */\n.brand-feature .parece-symbol{display:block;width:min(100%,210px);height:auto;aspect-ratio:1;object-fit:contain;filter:none}\n.brand-feature .feature-symbol-wrap{display:flex;justify-content:center;align-items:center}\n@media(max-width:800px){.brand-feature .parece-symbol{width:min(100%,150px)}}\n@media(max-width:540px){.brand-feature .feature-grid{grid-template-columns:minmax(0,1fr)}.brand-feature .feature-symbol-wrap{display:flex;justify-content:center}.brand-feature .parece-symbol{width:min(100%,140px)}}\n'
          cssfile.write_text(css,encoding='utf-8')
          subprocess.check_call(['python3','editorial-revista/build.py'])
          html=(root/'index.html').read_text(encoding='utf-8')
          assert html.count('/revista/assets/img/parece-inventado-icone.png')==1
          assert 'alt="Símbolo do especial Parece Inventado?"' in html
          assert 'class="feature-symbol" src="/revista/assets/img/intellih-symbol-dark.png"' not in html
          assert (root/'editorias/parece-inventado.html').is_file()
          assert all('<meta name="robots" content="noindex,nofollow">' in p.read_text(encoding='utf-8') for p in root.rglob('*.html'))
          assert {p.name:article_body(p) for p in articles}==before, 'Textos dos artigos alterados'
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed=={'editorial-revista/build.py','public/revista/assets/style.css','public/revista/index.html'},changed
          print('APROVADO: icone transparente de 600 px, substituicao no gerador e na capa, layout desktop/mobile; artigos e noindex preservados.')
          PY
      - name: Gravar alteracoes apenas na branch de previa
        run: |
          test "$(git branch --show-current)" = revista-preview-20260917
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editorial-revista/build.py public/revista/assets/style.css public/revista/index.html public/revista/assets/img/parece-inventado-icone.png
          git diff --cached --quiet && { echo 'Nenhuma alteracao'; exit 1; }
          git commit -m "Usar simbolo do Parece Inventado no especial da previa"
          git push origin HEAD:revista-preview-20260917