name: Auditar links e ajustar rodapé da revista (temporário)
on:
  push:
    branches: [revista-preview-20260917]
    paths: [.github/workflows/revista-auditoria-rodape-temporario.yml]
permissions:
  contents: write
jobs:
  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Corrigir generalização sobre imagens sem alterar os artigos
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          generator=Path('editorial-revista/build.py')
          original=generator.read_text(encoding='utf-8')
          old='Imagens de capa ilustrativas; fontes em cada artigo.'
          new='Fotografias e ilustrações identificadas nas matérias; fontes em cada artigo.'
          assert original.count(old)==1, 'Texto do rodapé alterado; interromper'
          generator.write_text(original.replace(old,new),encoding='utf-8')
          PY
          python3 editorial-revista/build.py
      - name: Conferir rotas, recursos, créditos e segurança da prévia
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit,unquote
          root=Path('public')
          base=root/'revista'
          articles=json.loads(Path('editorial-revista/conteudo/artigos.json').read_text(encoding='utf-8'))
          news=json.loads(Path('editorial-revista/conteudo/noticias.json').read_text(encoding='utf-8'))
          assert len(articles)==3 and len(news)==1
          pages=[base/'index.html', *sorted((base/'artigos').glob('*.html')),*sorted((base/'editorias').glob('*.html'))]
          assert len(pages)==12,(len(pages),pages)
          expected_credit='ESA/Webb, NASA, CSA, K. Luhman, C. Alves De Oliveira, M. Zamani (ESA/Webb)'
          checked=0
          class Links(HTMLParser):
            def __init__(self):super().__init__();self.refs=[]
            def handle_starttag(self,tag,attrs):
              if tag not in ('a','img','script','link'):return
              data=dict(attrs)
              for key in ('href','src'):
                if data.get(key):self.refs.append((tag,data[key]))
          for page in pages:
            html=page.read_text(encoding='utf-8')
            assert 'noindex,nofollow' in html,page
            assert 'Imagens de capa ilustrativas' not in html,page
            if page.name!='ia-com-metodo.html':
              assert 'PRÉVIA EDITORIAL' in html,page
              assert 'Fotografias e ilustrações identificadas nas matérias' in html,page
            if 'weic2619a.jpg' in html:
              assert expected_credit in html,page
              assert 'IC 348' in html,page
            parser=Links();parser.feed(html)
            for tag,ref in parser.refs:
              u=urlsplit(ref)
              if u.scheme or ref.startswith('#') or u.netloc:continue
              p=unquote(u.path)
              if not p.startswith('/revista/'):continue
              dest=root/p.lstrip('/')
              if p.endswith('/'):dest=dest/'index.html'
              assert dest.is_file(),f'{page}: link/recurso local inexistente: {ref}'
              checked+=1
          assert (base/'editorias/inteligencia-artificial.html').is_file()
          assert '/revista/editorias/inteligencia-artificial.html' in (base/'editorias/ia-com-metodo.html').read_text(encoding='utf-8')
          print(f'OK: {len(pages)} páginas HTML; {checked} referências internas, créditos Webb, metadados noindex e rodapé conferidos.')
          PY
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert 'editorial-revista/build.py' in changed,changed
          assert changed <= {'editorial-revista/build.py'} | {p for p in changed if p.startswith('public/revista/')},changed
          assert 'editorial-revista/conteudo/artigos.json' not in changed and 'editorial-revista/conteudo/noticias.json' not in changed
          assert len([p for p in changed if p.startswith('public/revista/')])>=10,changed
          print('OK: mudanças restritas ao gerador/HTML da revista; fontes editoriais preservadas.')
          PY
      - name: Registrar apenas o ajuste no rascunho
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add editorial-revista/build.py public/revista/
          git diff --cached --check
          git commit -m 'Revista: rodapé preciso e auditoria de links da prévia'
          git push origin HEAD:revista-preview-20260917
