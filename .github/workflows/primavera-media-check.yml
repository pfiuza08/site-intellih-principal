name: Testar imagem editorial Primavera dos Museus
on:
  push:
    branches: [artigo-primavera-museus-20260922]
    paths: [.github/workflows/primavera-media-check.yml]
permissions:
  contents: read
jobs:
  imagem:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar tamanho do recurso original e variante de resolução
        shell: bash
        run: |
          set -euo pipefail
          original='https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F0ca98624-44aa-466f-ac44-b52322a87c0c/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAADSA3x444syzm67NLtB4X1UYtNldjs3fcfYl3ShJCrR_&exp=1790106385&osig=AAAAAAAAAAAAAAAAAAAAAHvYzd3W3AS3j-uYd081HNMWrPdlEGMBZzcWtCLXhexc&signer=media-rpc&x-canva-quality=thumbnail'
          large="${original/height:200/height:1402}"
          large="${large/width:160/width:1122}"
          for name in original large; do
            if [ "$name" = large ]; then url="$large"; else url="$original"; fi
            status=$(curl -L -sS --max-time 40 -w '%{http_code}' -o "/tmp/$name.png" "$url" || true)
            echo "$name HTTP=$status bytes=$(wc -c < "/tmp/$name.png")"
            file "/tmp/$name.png"
          done